[project]
name = "proyecto-data-cleansing"
version = "0.1.0"
description = "Ambiente Datacleasing"
authors = [
    {name = "Jose Dario Hernandez",email = "josedariohernandez2@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pandas (>=3.0.1,<4.0.0)",
    "numpy (>=2.4.3,<3.0.0)",
    "google-generativeai (>=0.8.6,<0.9.0)",
    "dotenv (>=0.9.9,<0.10.0)",
    "openpyxl (>=3.1.5,<4.0.0)",
    "ipykernel (>=7.2.0,<8.0.0)",
    "plotly (>=6.6.0,<7.0.0)",
    "nbformat (>=5.10.4,<6.0.0)",
    "matplotlib (>=3.10.8,<4.0.0)",
    "joblib (>=1.5.3,<2.0.0)",
    "scikit-learn (>=1.8.0,<2.0.0)",
    "python-dotenv (>=1.2.2,<2.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
